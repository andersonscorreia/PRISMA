{% extends 'core/base.html' %}

{% block title %}Entrar - PRISMA{% endblock %}

{% block content %}
<div class="flex flex-col justify-center py-4 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <!-- Logo -->
        <div
            class="mx-auto w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center shadow-md shadow-brand-500/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
        </div>
        <h2 class="mt-3 text-center text-xl font-bold text-gray-900 dark:text-white">
            Acesse o PRISMA
        </h2>
    </div>

    <div class="mt-4 sm:mx-auto sm:w-full sm:max-w-sm">
        <div
            class="bg-white dark:bg-zinc-900 py-5 px-5 border border-gray-200 dark:border-zinc-800 shadow-sm sm:rounded-xl sm:px-6">

            <!-- Messages (Error Alerts) -->
            {% if messages %}
            <div class="mb-3">
                {% for msg in messages %}
                <div
                    class="p-2.5 bg-red-50 dark:bg-brand-950/30 text-brand-500 rounded-lg text-xs font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    {{ msg }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form class="space-y-4" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div>
                    <label for="username"
                        class="block text-[11px] font-semibold text-gray-700 dark:text-zinc-300 uppercase tracking-wider">
                        Usuário / Login
                    </label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required autocomplete="username"
                            class="appearance-none block w-full px-3 py-1.5 border border-gray-300 dark:border-zinc-700 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-xs bg-white dark:bg-zinc-950 text-gray-900 dark:text-white">
                    </div>
                </div>

                <div>
                    <label for="password"
                        class="block text-[11px] font-semibold text-gray-700 dark:text-zinc-300 uppercase tracking-wider">
                        Senha
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required autocomplete="current-password"
                            class="appearance-none block w-full px-3 py-1.5 border border-gray-300 dark:border-zinc-700 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-xs bg-white dark:bg-zinc-950 text-gray-900 dark:text-white">
                    </div>
                </div>

                <div class="pt-1">
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-xs font-semibold text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 active:scale-[0.98] transition-transform duration-75">
                        Login
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
